name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Rust toolchain
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          override: true
          profile: minimal

      # Install required cargo tools (cargo-lipo, cargo-bundle)
      - name: Install cargo-lipo and cargo-bundle
        run: |
          rustup component add rust-src
          cargo install cargo-lipo --locked
          cargo install cargo-bundle --locked

      # Build the release binary for iOS
      - name: Build iOS release
        run: cargo lipo --release --target aarch64-apple-ios

      # Bundle the app into an .ipa
      - name: Bundle iOS app
        run: |
          cargo bundle --release --target aarch64-apple-ios

      # Archive the generated .ipa artifact
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: eschool-app-ipa
          path: target/aarch64-apple-ios/release/bundle/ios/*.ipa

