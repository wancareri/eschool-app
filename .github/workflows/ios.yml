name: iOS Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install day-cli
        run: cargo install day-cli

      - name: Check environment
        run: day doctor

      - name: Build for iOS
        run: day build -p ios-uikit --profile release --verbose
