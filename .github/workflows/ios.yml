name: iOS Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    strategy:
      matrix:
        variant: [dev, release]
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ matrix.variant }}

      - name: Install day-cli
        run: cargo install day-cli

      - name: Check environment
        run: day doctor

      - name: Set dev bundle ID
        if: matrix.variant == 'dev'
        run: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = by.eschool.app/PRODUCT_BUNDLE_IDENTIFIER = by.eschool.app.dev/' platform/ios/DayApp.xcconfig
          sed -i '' 's/PRODUCT_NAME = EschoolApp/PRODUCT_NAME = EschoolApp-Dev/' platform/ios/DayApp.xcconfig

      - name: Build dev features
        if: matrix.variant == 'dev'
        run: |
          sed -i '' 's/^dev = \["oslog"\]/dev = ["oslog"]/' Cargo.toml
          echo 'DEV_FEATURES=--features dev' >> $GITHUB_ENV

      - name: Build for iOS (dev)
        if: matrix.variant == 'dev'
        run: day pack -p ios-uikit --profile release --no-sign --verbose -- --features dev

      - name: Build for iOS (release)
        if: matrix.variant == 'release'
        run: day pack -p ios-uikit --profile release --no-sign --verbose

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ matrix.variant }}
          path: build/day/dist/*.ipa
          retention-days: 7
