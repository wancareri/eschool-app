[package]
name = "eschool-api"
version = "0.1.0"
edition = "2021"
description = "Unofficial API client for diary.e-schools.by (e-schools.by diary)"
license = "MIT"
repository = "https://github.com/wancareri/eschool-app"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking", "cookies"] }
urlencoding = "2"
base64 = "0.22"
regex = "1"
