name: Build iOS IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: aarch64-apple-ios
          override: true
          profile: minimal

      - name: Install day-cli
        run: cargo install day-cli

      - name: Build and Archive iOS App
        run: |
          xcodebuild archive \
            -project platform/ios/DayApp.xcodeproj \
            -scheme DayApp \
            -configuration Release \
            -archivePath archive/DayApp.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r archive/DayApp.xcarchive/Products/Applications/*.app Payload/
          zip -qr eschool-app.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: eschool-app-ipa
          path: eschool-app.ipa
