name: Build All Platforms

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  DAY_CLI_VERSION: "0.7.1"

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-ios-${{ hashFiles('Cargo.lock') }}
      - run: cargo install day-cli --version ${{ env.DAY_CLI_VERSION }} --locked
      - run: day pack -t ios-uikit --profile release --no-sign --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/day/dist/*.ipa
          retention-days: 7

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-macos-${{ hashFiles('Cargo.lock') }}
      - run: cargo install day-cli --version ${{ env.DAY_CLI_VERSION }} --locked
      - run: day pack -t macos-appkit --profile release --no-sign --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/day/dist/*.dmg
          retention-days: 7

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Android NDK env
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          NDK_BIN="$(echo "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/*/bin)"
          echo "CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK_BIN/llvm-ar" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-android-${{ hashFiles('Cargo.lock') }}
      - run: cargo install day-cli --version ${{ env.DAY_CLI_VERSION }} --locked
      - run: day pack -t android-material --profile release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/day/dist/*.apk
          if-no-files-found: error
          retention-days: 7

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-linux-${{ hashFiles('Cargo.lock') }}
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libwebkitgtk-6.0-dev
      - run: cargo install day-cli --version ${{ env.DAY_CLI_VERSION }} --locked
      - run: day pack -t linux-gtk --profile release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: build/day/dist/*.AppImage
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-windows-${{ hashFiles('Cargo.lock') }}
      - run: cargo install day-cli --version ${{ env.DAY_CLI_VERSION }} --locked
      - run: day pack -t windows-xaml --profile release --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: build/day/dist/*.msix
          retention-days: 7
