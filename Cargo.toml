[package]
name = "eschool-app"
version = "0.1.0"
edition = "2024"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/project-structure).
default = ["mock"]
appkit = ["day/appkit", "day-piece-swiftui/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit", "day-piece-lottie/uikit", "day-piece-swiftui/uikit"]
mdc = ["material"]
material = ["day/material", "day-piece-lottie/material"]
xaml = ["day/xaml"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib", "staticlib"]

[dependencies]
day-spec = "=0.7.1"
day-core = "=0.7.1"
eschool-api = { path = "crates/eschool-api" }
day = { package = "day-app", version = "=0.7.1", features = ["model"] }
day-piece-lottie = "=0.5.2"
day-piece-settings = "=0.7.1"
day-piece-swiftui = "=0.7.1"
day-part-clipboard = "=0.7.1"
day-part-biometrics = "=0.7.1"
day-part-haptics = "=0.7.1"
# The item list persists as one JSON blob in `day::prefs` (src/model.rs).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking", "cookies"] }
urlencoding = "2"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
log = "0.4"
toml = "0.8"
regex = "1"
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
day-uikit = { package = "day-toolkit-uikit", version = "=0.7.1" }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray", "NSDictionary", "NSUserDefaults", "NSError", "NSNotification", "NSPathUtilities"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = [] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
dispatch2 = "0.3"
objc2-ui-kit = { version = "0.3", features = [
    "UIApplication", "UIView", "UIWindow", "UIScreen", "UIViewController",
    "UINavigationController", "UIKitCore", "block2",
    "UIColor", "UINavigationBar", "UITabBar", "UISwitch", "UIButton", "UIBarButtonItem",
    "UIVisualEffectView", "UIBlurEffect", "UIVisualEffect",
    "UIFeedbackGenerator", "UIImpactFeedbackGenerator", "UISelectionFeedbackGenerator",
    "UIGeometry", "UIAlertController", "UIAction", "UIMenu", "UIMenuElement", "UIImage",
    "UIImageSymbolConfiguration",
] }
objc2-user-notifications = { version = "0.3", features = [
    "UNUserNotificationCenter", "UNNotificationSettings", "UNNotificationRequest",
    "UNNotificationContent", "UNNotificationSound",
] }
objc2-local-authentication = { version = "0.3", features = ["block2"] }

[package.metadata.day.ios]
swift-packages = [{ path = "platform/swiftui", products = ["EschoolViews"] }]
platform = "16.0"

[package.metadata.day.macos]
swift-packages = [{ path = "platform/swiftui", products = ["EschoolViews"] }]
platform = "13.0"

[build-dependencies]
day-build = "=0.7.1"

# Layout probes (tests/layout_probe.rs) boot the mock toolkit directly.
[dev-dependencies]
day-core = "=0.7.1"
day-mock = "=0.7.1"
day-spec = "=0.7.1"


[workspace]
members = [".", "crates/eschool-api"]

