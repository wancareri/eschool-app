[package]
name = "eschool-api"
version = "0.1.0"
edition = "2021"
description = "Unofficial API client for diary.e-schools.by (e-schools.by diary)"
license = "MIT"
repository = "https://github.com/wancareri/eschool-app"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "cookies"] }
urlencoding = "2"
base64 = "0.22"
regex = "1"

# Match the application's TLS backend so Android never pulls in OpenSSL.
[target.'cfg(not(target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(target_os = "ios")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
