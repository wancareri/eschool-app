name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache day-cli binary
        uses: actions/cache@v4
        id: cache-day
        with:
          path: ~/.cargo/bin/day
          key: ${{ runner.os }}-day-cli-0.1

      - name: Install day-cli
        if: steps.cache-day.outputs.cache-hit != 'true'
        run: cargo install day-cli

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          targets: aarch64-apple-ios

      - name: Build and Pack iOS App
        run: day pack --target ios-uikit --profile release --no-sign --verbose

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/day/dist/*.ipa
          retention-days: 7
